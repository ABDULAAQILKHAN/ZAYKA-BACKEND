version: '3.9'
services:
  api:
    container_name: zayka-backend
    build: .
    restart: always
    env_file: .env
    ports:
      - "4000:4000"
    networks:
      - zayka-network

  nginx:
    image: nginx:stable-alpine
    container_name: zayka-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - zayka-network

networks:
  zayka-network:
    driver: bridge
